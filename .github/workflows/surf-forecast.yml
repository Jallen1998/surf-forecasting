# Runs the surf pipeline twice a day in the cloud: fetch -> score -> detect
# -> track -> Telegram -> commit state/windows.csv back to the repo.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# Once this is live, do NOT do real runs locally (use --dry-run): two
# places writing state/windows.csv would fight. Pull in GitHub Desktop
# before editing, since the bot commits state after each run.

name: Surf forecast

on:
  schedule:
    # Cron is UTC. 06:17/18:17 UTC = 07:17/19:17 Copenhagen in winter (CET),
    # 08:17/20:17 in summer (CEST). Off the hour because GitHub delays
    # top-of-hour scheduled runs most.
    - cron: "17 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: no Telegram, no state change"
        type: boolean
        default: false

permissions:
  contents: write # to commit state/windows.csv

concurrency:
  group: surf-forecast # never two runs writing state at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANG: C.UTF-8 # the YAML configs contain ø/å/— (see detect_windows.R)
      LC_ALL: C.UTF-8
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true # prebuilt binary packages: fast installs

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-pkgs-${{ runner.os }}-v1

      - name: Install R packages
        run: |
          Rscript -e 'pkgs <- c("httr", "jsonlite", "dplyr", "yaml", "purrr", "tibble");
                      need <- setdiff(pkgs, rownames(installed.packages()));
                      if (length(need)) install.packages(need)'

      - name: Tests (a failing test stops the run before anything is sent)
        run: for t in tests/test_*.R; do Rscript "$t"; done

      - name: Run pipeline
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            Rscript run_daily.R --dry-run
          else
            Rscript run_daily.R
          fi

      - name: Commit state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "surf-forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/windows.csv
          if git diff --cached --quiet; then
            echo "State unchanged."
          else
            git commit -m "State update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main # in case you pushed code during the run
            git push
          fi

      # A silent failure looks exactly like "no new surf", so say so loudly.
      - name: Telegram alert on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="Surf forecast run FAILED. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null

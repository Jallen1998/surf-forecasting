# spots.yaml
# Coordinates are converted from Jack's DMS readings — high confidence.
# facing_deg / offshore_arc are MY estimates from his written descriptions
# of each break, NOT measured — these are the part still needing his
# review/correction before the scoring logic is trusted. See per-spot
# notes below.

spots:

  # --- West Jutland (Tier A — groundswell exposed) -------------------
  hanstholm_beach:
    lat: 57.1248
    lon: 8.6144
    tier: A_groundswell
    facing_deg: 310          # NW-ish, open coast, partially sheltered by the harbour wall
    offshore_arc: [110, 190] # roughly SE-S quadrant offshore
    note: "Punchy beach break, partially protected by Hanstholm havn."

  hanstholm_point:
    lat: 57.1243
    lon: 8.6262
    tier: A_groundswell
    facing_deg: 0             # faces more north — catches N-leaning swell directly
    offshore_arc: [150, 230]  # S through SE-SW is offshore here, per Jack's note
    note: >
      Longboard point wave, east of the beach break past the next break
      wall. Needs a swell with more north in it, wind from south or no
      further north than due east. Best option when open beaches are
      blown out by big storm swells — opposite wind signature to
      hanstholm_beach, so do NOT merge these into one spot profile.

  klitmoller:
    lat: 57.0440
    lon: 8.4800
    tier: A_groundswell
    facing_deg: 280
    offshore_arc: [80, 160]
    note: "Coordinates from webcam/surf-forecast.com, not yet confirmed by Jack."

  vorupoer:
    lat: 57.0200
    lon: 8.4500
    tier: A_groundswell
    facing_deg: 275
    offshore_arc: [75, 155]
    note: "Coordinates from surf-forecast.com, not yet confirmed by Jack."


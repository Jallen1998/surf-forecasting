# windows.yaml
# How hourly scored blocks are turned into "windows". The Good cutoff
# itself is NOT set here: it's read from tiers.yaml category_cutoffs$good
# so there is one source of truth for what Good means.
#
# All numbers below are first guesses. Tune them from the
# recalibration log, not by eye on one forecast.

detection:
  light: civil            # civil = civil dawn->dusk; sunrise = sunrise->sunset
  daylight_pad_min: 30    # each hourly block stands in for +/-30 min
  hold_margin: 1.0        # once open, a window stays open while score >= good - hold_margin
  max_gap_hours: 1        # bridge dips below the hold level lasting at most this many hours
  min_duration_hours: 2   # shorter windows are dropped (not worth a drive)

# "Worth a look" band below Good. Shown on the phone page only, never
# pushed. Added after a Mølle forecast of 1.3 m @ 5 s offshore scored 5.6:
# below Good, but a session I'd still want to know about.
consider:
  min_score: 5.0

# Tracking windows across runs (R/track_windows.R). Alerts are decided by
# comparing each window with what I was LAST TOLD about it, not with
# the previous run, so wobble between runs never re-alerts.
tracking:
  match_slack_hours: 3          # windows at the same spot match if their spans overlap within this slack
  confirm_ewam_share: 0.5       # stage = confirmed once >= this share of hours is EWAM (else heads_up)
  change_start_hours: 3         # confirmed windows: start moved >= this vs last alert -> CHANGED
  change_duration_frac: 0.5     # ...or duration changed by >= this fraction
  change_duration_min_hours: 2  #    and by at least this many hours
  keep_past_days: 14            # keep finished windows this long (weekly digest, recalibration prompts)
  # A window that disappears is CANCELLED only if the best score left in
  # its old span drops below detection hold level (good - hold_margin).
  # Otherwise it is "faded": kept silently, and if it comes back nothing
  # is sent unless it differs from what I was last told.
